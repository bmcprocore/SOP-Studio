<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />

<title>Procore SOP Builder — step per page</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --orange: #FF5200; --ink: #1A202C; --sand: #FBF8F4;
    --g100: #EEF0F3; --g200: #E1E4E8; --g300: #C7CCD3; --g500: #6B7380; --g600: #4A525E;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink); background: var(--sand); display: flex; flex-direction: column; height: 100vh;
  }
  header.bar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 22px; height: 60px; background: #fff; border-bottom: 1px solid var(--g200); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand .hex { width: 13px; height: 11px; background: var(--orange);
    clip-path: polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%); }
  .brand small { color: var(--g500); font-weight: 500; }
  .bar .actions { display: flex; gap: 10px; }
  button {
    font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 6px;
    padding: 9px 16px; border: 1px solid var(--g300); background: #fff; color: var(--ink);
    transition: all .12s ease;
  }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
  button.primary:hover { background: #E64A00; border-color: #E64A00; }
  main { flex: 1; display: grid; grid-template-columns: 440px 1fr; min-height: 0; }
  .editor { display: flex; flex-direction: column; border-right: 1px solid var(--g200); background: #fff; min-height: 0; }
  .editor .hd { padding: 14px 18px 10px; }
  .editor .hd h2 { margin: 0 0 4px; font-size: 15px; }
  .editor .hd p { margin: 0; font-size: 12.5px; color: var(--g500); line-height: 1.45; }
  textarea {
    flex: 1; margin: 0; border: 0; border-top: 1px solid var(--g200); resize: none; padding: 14px 18px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--g600); outline: none;
  }
  .editor .ft { padding: 10px 18px; border-top: 1px solid var(--g200); display: flex; gap: 10px; align-items: center; }
  .editor .ft .msg { font-size: 12px; color: var(--g500); flex: 1; }
  .editor .ft .msg.err { color: #C0392B; }
  .preview { background: #E9E5DF; min-height: 0; position: relative; }
  .preview iframe { width: 100%; height: 100%; border: 0; display: block; }
  .hint-row { display: flex; gap: 8px; padding: 0 18px 12px; flex-wrap: wrap; }
  .hint-row button { padding: 6px 11px; font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="hex"></span> Procore SOP Builder <small>· locked design v2 · one step per page · access panel</small></div>
  <div class="actions">
    <button id="copyPrompt">Copy content prompt</button>
    <button id="render">Render preview</button>
    <button id="download" class="primary">Download SOP</button>
  </div>
</header>
<main>
  <section class="editor">
    <div class="hd">
      <h2>SOP content (JSON)</h2>
      <p>Paste the content JSON for your SOP — the <strong>same JSON</strong> the standard builder uses. The design is fixed; this variant simply starts every procedure step on a new page.</p>
    </div>
    <div class="hint-row">
      <button id="loadExample">Load example</button>
      <button id="format">Tidy JSON</button>
    </div>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="ft"><span class="msg" id="msg">Ready.</span></div>
  </section>
  <section class="preview"><iframe id="frame"></iframe></section>
</main>

-top:auto;background:var(--procore-sand-50);border-left:4px solid var(--procore-orange);\n    padding:22px 26px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}\n  .cover-meta .field-label{font-size:8.5pt;text-transform:uppercase;letter-spacing:.1em;font-weight:600;\n    color:var(--procore-gray-600);margin-bottom:4px;}\n  .cover-meta .field-value{font-size:11pt;color:var(--procore-ink);font-weight:500;line-height:1.35;}\n  .doc-control{margin-top:24px;border-top:1px solid var(--rule);}\n  .doc-control table{width:100%;border-collapse:collapse;font-size:9.5pt;}\n  .doc-control th,.doc-control td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;}\n  .doc-control th{font-weight:600;color:var(--procore-gray-600);text-transform:uppercase;letter-spacing:.08em;\n    font-size:8pt;background:var(--procore-gray-50);width:22%;}\n  /* sections */\n  .section{margin-bottom:12px;} .section:last-child{margin-bottom:0;}\n  .section-eyebrow{font-size:8.5pt;text-transform:uppercase;letter-spacing:.12em;font-weight:700;\n    color:var(--procore-orange);margin-bottom:6px;display:flex;align-items:center;gap:8px;}\n  h1.section-title{font-family:var(--font-display);font-size:20pt;line-height:1.08;letter-spacing:-.02em;\n    font-weight:500;color:var(--procore-ink);margin:0 0 4px;}\n  h2.subhead{font-family:var(--font-display);font-size:12.5pt;font-weight:600;color:var(--procore-ink);\n    letter-spacing:-.005em;margin:0 0 6px;}\n  .lead{font-size:10.5pt;color:var(--procore-gray-700);line-height:1.5;max-width:72ch;margin-bottom:8px;}\n  p{margin:0 0 6px;}\n  .page-intro{display:flex;gap:18px;align-items:flex-start;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--rule);}\n  .page-intro .body{flex:1;}\n  .page-intro .meta{flex:0 0 200px;background:var(--procore-sand-50);border-left:3px solid var(--procore-orange);\n    padding:12px 14px;font-size:9pt;line-height:1.45;color:var(--procore-gray-700);}\n  .page-intro . <script>
// SOP renderer — STEP-PER-PAGE VARIANT. Identical to the standard renderer except the
// Procedure section places exactly ONE step per page (each step starts on a new page).
// Injects a content object into the LOCKED Procore design (window.SOP_DESIGN).
// The design markup (CSS, wordmark SVG, class names) is NEVER regenerated here — only
// content strings are slotted into fixed component templates. Pagination is done by
// measuring real rendered height inside a sandbox document, so each section flows onto as
// many pages as it needs without squashing.
(function () {
  const D = window.SOP_DESIGN;
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // allow a few inline tags in body copy (code, strong, em) — content authors may use them
  const rich = (s) => esc(s)
    .replace(/&lt;code&gt;/g, '<code>').replace(/&lt;\/code&gt;/g, '</code>')
    .replace(/&lt;strong&gt;/g, '<strong>').replace(/&lt;\/strong&gt;/g, '</strong>')
    .replace(/&lt;em&gt;/g, '<em>').replace(/&lt;\/em&gt;/g, '</em>');

  const ph = (v, label) => (v && String(v).trim())
    ? esc(v)
    : '<span class="placeholder">[' + esc(label) + ']</span>';
  const phi = (v, label) => (v && String(v).trim())
    ? esc(v)
    : '<span class="ph">[' + esc(label) + ']</span>';

  const STATUS = {
    'in-progress': 'In progress', 'review': 'Under review',
    'approved': 'Approved', 'draft': 'Draft',
  };

  function header(c) {
    return '<header class="pg-header"><span class="logo">' + D.wordmark + '</span>' +
      '<span class="doc-id"><span class="title">Standard Operating Procedure</span>' +
      '<span class="sep"></span><span>' + ph(c.docId, 'SOP-PRC-000') + ' · v' + ph(c.version, '1.0') +
      '</span></span></header>';
  }
  // v3 — author attribution printed on every page. Single source: change it here.
  const SOP_ATTRIBUTION = 'Created by Brendan McGurk \u00b7 APAC Strategic Product Consultant' +
    ' \u00b7 Questions or support: message me on Slack, or post in the SOP Studio channel';

  function footer(c, nn, total) {
    return '<footer class="pg-footer">' +
      '<div class="footer-row">' +
      '<span class="footer-mark"><span class="hex"></span> Procore \u00b7 Confidential to ' + phi(c.customer, 'Customer') + '</span>' +
      '<span class="confidential">Revision ' + esc(c.version || '1.0') + ' \u00b7 ' +
      (c.effectiveFrom && c.effectiveFrom.trim() ? esc(c.effectiveFrom) : '[DD Mmm YYYY]') + '</span>' +
      '<span class="pageno">' + String(nn).padStart(2, '0') + '<span class="total"> / ' + String(total).padStart(2, '0') + '</span></span>' +
      '</div>' +
      '<div class="footer-by">' + SOP_ATTRIBUTION + '</div></footer>';
  }
  const pageEl = (c, bodyHtml, nn, total) =>
    '<article class="page">' + header(c) + '<div class="pg-body">' + bodyHtml + '</div>' +
    footer(c, nn, total) + '</article>';

  // ---- COVER (single fixed page) ----
  function cover(c, total) {
    const status = c.status && STATUS[c.status] ? c.status : 'in-progress';
    const dc = (label, detail, who, date) =>
      '<tr><td><strong>' + label + '</strong></td><td>' + esc(detail) + '</td><td>' +
      ph(who, who === undefined ? 'TBC' : 'Pending') + '</td><td>' +
      (date && date.trim() ? esc(date) : '<span class="placeholder">[DD Mmm YYYY]</span>') + '</td></tr>';
    const a = c.approvals || {};
    const body =
      '<span class="cover-eyebrow"><span class="hex"></span> Procore implementation · Customer SOP</span>' +
      '<h1 class="cover-title">' + ph(c.processName, 'Process name') + '<br/>Standard operating procedure</h1>' +
      '<p class="cover-sub">' + (c.subtitle && c.subtitle.trim() ? rich(c.subtitle)
        : 'A step-by-step guide for executing ' + phi(c.process, 'process') + ' within Procore, authored for ' + phi(c.customer, 'Customer name') + '.') + '</p>' +
      '<div class="cover-meta">' +
        '<div><div class="field-label">Customer</div><div class="field-value">' + ph(c.customer, 'Customer name') + '</div></div>' +
        '<div><div class="field-label">Process owner</div><div class="field-value">' + ph(c.processOwner, 'Name · Role') + '</div></div>' +
        '<div><div class="field-label">Version · Status</div><div class="field-value">v' + esc(c.version || '1.0') +
          ' · <span class="pill-status ' + status + '">' + STATUS[status] + '</span></div></div>' +
        '<div><div class="field-label">Effective from</div><div class="field-value">' + ph(c.effectiveFrom, 'DD Mmm YYYY') + '</div></div>' +
      '</div>' +
      '<div class="doc-control"><table><thead><tr><th>Document control</th><th>Detail</th><th>Author / approver</th><th>Date</th></tr></thead><tbody>' +
        dc('Prepared by', 'Procore Implementation Manager', (a.preparedBy || {}).name, (a.preparedBy || {}).date) +
        dc('Reviewed by', 'Customer process owner', (a.reviewedBy || {}).name, (a.reviewedBy || {}).date) +
        dc('Approved by', 'Customer project sponsor', (a.approvedBy || {}).name, (a.approvedBy || {}).date) +
        dc('Scheduled review', 'Customer Success Engineer review', (a.scheduledReview || {}).name, (a.scheduledReview || {}).date) +
      '</tbody></table></div>';
    return pageEl(c, body, 1, total);
  }

  // ---- SECTION COMPONENT BUILDERS ----
  function intro(n, name, title, lead, metaLabel, metaValue) {
    return '<div class="page-intro"><div class="body">' +
      '<span class="section-eyebrow"><span class="hex"></span> Section ' + String(n).padStart(2, '0') + ' · ' + name + '</span>' +
      '<h1 class="section-title">' + title + '</h1>' +
      '<p class="lead">' + lead + '</p></div>' +
      '<div class="meta"><span class="label">' + esc(metaLabel) + '</span>' + (metaValue || '') + '</div></div>';
  }
  const contEyebrow = (n, name) =>
    '<span class="section-eyebrow" style="display:flex;margin-bottom:14px;"><span class="hex"></span> Section ' +
    String(n).padStart(2, '0') + ' · ' + name + ' (continued)</span>';

  // v2: 'Your access in this tool' — replaces the roles & responsibilities table.
  // Reads c.access = { tool, level, levelMeaning, granular:[{name,meaning}], notIncluded:[".."] }
  function accessBlock(c) {
    const a = c.access || {};
    const rows = (a.granular || []).map(g =>
      '<tr><td class="role">' + ph(g.name, 'Granular permission') + '</td><td>' +
      rich(g.meaning || '[What it lets you do]') + '</td></tr>').join('');
    const granTable = rows
      ? '<table class="roles perm-table"><thead><tr><th>Granular permission</th><th>What it lets you do</th></tr></thead><tbody>' +
        rows + '</tbody></table>'
      : '';
    const notInc = (a.notIncluded && a.notIncluded.length)
      ? '<div class="callout"><span class="label">Outside your access</span><span class="body">' +
        a.notIncluded.map(rich).join('<br/>') + '</span></div>'
      : '';
    return '<div class="section"><h2 class="subhead">Your access in this tool</h2>' +
      '<div class="access-panel"><div class="lvl"><span class="lvl-label">' + ph(a.tool, 'Tool') +
      ' · access level</span><span class="lvl-value">' + ph(a.level, 'Permission level') + '</span></div>' +
      '<div class="lvl-meaning">' + (a.levelMeaning ? rich(a.levelMeaning)
        : '<span class="placeholder">[What this access level means for this user]</span>') + '</div></div>' +
      granTable + notInc + '</div>';
  }
  function phasesBlock(c) {
    const ps = (c.phases || []).slice(0, 4);
    while (ps.length < 4) ps.push({ name: '[Phase]', desc: '[…]' });
    return '<div class="section"><h2 class="subhead">Process at a glance</h2><div class="phases">' +
      ps.map((p, i) => '<div class="phase"><span class="num">PHASE ' + String(i + 1).padStart(2, '0') +
        '</span><div class="name">' + esc(p.name) + '</div><div class="desc">' + rich(p.desc) + '</div></div>').join('') +
      '</div></div>';
  }
  function stepItem(s, i) {
    const meta = [];
    if (s.role) meta.push('<span class="pill role">' + esc(s.role) + '</span>');
    if (s.system) meta.push('<span class="pill system">' + esc(s.system) + '</span>');
    if (s.time) meta.push('<span class="pill time">' + esc(s.time) + '</span>');
    const bullets = (s.bullets && s.bullets.length)
      ? '<ul>' + s.bullets.map(b => '<li>' + rich(b) + '</li>').join('') + '</ul>' : '';
    const callout = s.callout
      ? '<div class="callout"><span class="label">' + esc(s.callout.label || 'Procore') +
        '</span><span class="body">' + rich(s.callout.body) + '</span></div>' : '';
    return '<li class="step"><div class="step-num">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="step-body"><h3 class="step-title">' + ph(s.title, 'Step title') + '</h3>' +
      (meta.length ? '<div class="step-meta">' + meta.join('') + '</div>' : '') +
      (s.body ? '<p>' + rich(s.body) + '</p>' : '') + bullets + callout + '</div></li>';
  }
  function checklistBlock(c) {
    const items = (c.checklist || []).map(it =>
      '<div class="check-item"><div class="box"></div><div class="text">' + rich(it.text) +
      (it.hint ? '<span class="hint">' + rich(it.hint) + '</span>' : '') + '</div>' +
      '<div class="owner">' + esc(it.owner || '') + '</div></div>').join('');
    return '<div class="section"><h2 class="subhead">Close-out checklist</h2><div class="checklist">' +
      (items || '<div class="check-item"><div class="box"></div><div class="text">[Criterion]</div><div class="owner">[PM]</div></div>') +
      '</div></div>';
  }
  function issuesBlock(c) {
    const rows = (c.issues || []).map((it, i) =>
      '<tr><td class="code">' + esc(it.code || ('ERR-' + String(i + 1).padStart(2, '0'))) +
      '</td><td class="issue">' + rich(it.issue) + '</td><td class="fix">' + rich(it.resolution) + '</td></tr>').join('');
    if (!rows) return '';
    return '<div class="section"><h2 class="subhead">Common issues &amp; resolution</h2>' +
      '<table class="issues-table"><thead><tr><th>Reference</th><th>Issue</th><th>Resolution</th></tr></thead><tbody>' +
      rows + '</tbody></table></div>';
  }
  function refsBlock(c) {
    const rows = (c.references || []).map(r =>
      '<li><span class="tool">' + esc(r.tool) + '</span> <a href="' + esc(r.url) + '">' +
      esc((r.url || '').replace('https://support.procore.com/products/online/user-guide', 'support.procore.com/…')) +
      '</a></li>').join('');
    if (!rows) return '';
    return '<div class="section"><h2 class="subhead">Procore reference guides</h2><ul class="refs">' + rows + '</ul></div>';
  }
  function approvalsBlock(c) {
    return '<div class="section"><h2 class="subhead">Approvals</h2><div class="signoff">' +
      '<div class="sig"><div class="role">Customer process owner</div><div class="name">Signature</div><div class="date"><span>Name &amp; title</span><span>Date</span></div></div>' +
      '<div class="sig"><div class="role">Procore Implementation Manager</div><div class="name">Signature</div><div class="date"><span>Name &amp; title</span><span>Date</span></div></div>' +
      '</div></div>';
  }

  // ---- PAGINATION (measure in a sandbox pg-body) ----
  // onePerPage: force exactly one item per page (used for Procedure steps in this
  // step-per-page variant). The first page carries the section intro + item 1; every
  // following item starts a fresh page with the "(continued)" eyebrow.
  function paginate(section, measureBody) {
    const { introHtml, n, name, items, wrapOpen = '', wrapClose = '', onePerPage = false } = section;
    const bodyFor = (its, first) =>
      (first ? introHtml : contEyebrow(n, name)) + (its.length ? wrapOpen + its.join('') + wrapClose : '');
    if (onePerPage) {
      if (!items.length) return [bodyFor([], true)];
      return items.map((item, i) => bodyFor([item], i === 0));
    }
    const fits = (html) => {
      measureBody.innerHTML = html;
      return measureBody.scrollHeight <= measureBody.clientHeight + 1;
    };
    const pages = [];
    let placed = [];
    let first = true;
    for (const item of items) {
      const trial = placed.concat([item]);
      if (placed.length === 0 || fits(bodyFor(trial, first))) {
        placed = trial;
      } else {
        pages.push(bodyFor(placed, first));
        first = false;
        placed = [item];
      }
    }
    pages.push(bodyFor(placed, first));
    return pages;
  }

  // ---- BUILD ----
  // sandboxDoc: a document whose <head> has the SOP css; must contain an element
  //   #sop-measure-body styled as .pg-body inside a .page (offscreen).
  function build(c, sandboxDoc) {
    const measureBody = sandboxDoc.getElementById('sop-measure-body');

    const sections = [
      {
        n: 1, name: 'Overview',
        introHtml: intro(1, 'Overview', 'Purpose, scope and your access',
          rich(c.purpose) || '[One-paragraph purpose of this SOP.]', 'Applies to',
          phi(c.appliesTo, 'Business unit / region / project type')),
        items: [accessBlock(c), phasesBlock(c)],
      },
      {
        n: 2, name: 'Procedure',
        introHtml: intro(2, 'Procedure', 'Step-by-step in Procore',
          rich(c.procedureIntro) || '[Intro to the steps.]', 'Reference tool',
          phi(c.referenceTool, 'RFIs / Submittals / Inspections')),
        items: (c.steps || []).map((s, i) => stepItem(s, i)),
        wrapOpen: '<ol class="steps">', wrapClose: '</ol>',
        onePerPage: true,
      },
      {
        n: 3, name: 'Close out',
        introHtml: intro(3, 'Close out', 'Validate, troubleshoot &amp; approve',
          rich(c.closeoutIntro) || '[Intro.]', 'Owner', phi(c.owner, 'Process owner')),
        items: [checklistBlock(c), issuesBlock(c), refsBlock(c), approvalsBlock(c)].filter(Boolean),
      },
    ];

    // paginate each section into body strings
    const bodies = [];
    sections.forEach(s => paginate(s, measureBody).forEach(b => bodies.push(b)));
    const total = 1 + bodies.length;

    let html = cover(c, total);
    bodies.forEach((b, i) => { html += pageEl(c, b, i + 2, total); });
    return { pagesHtml: html, total };
  }

  // Assemble a complete, standalone SOP document string.
  function document_(c, sandboxDoc) {
    const { pagesHtml } = build(c, sandboxDoc);
    return '<!doctype html>\n<html lang="en-AU">\n<head>\n<meta charset="utf-8" />\n' +
      '<title>Procore — ' + esc(c.processName || 'SOP') + '</title>\n' +
      D.fontLinks + '\n<style>' + D.css + '</style>\n</head>\n<body>\n<div class="viewer">\n' +
      pagesHtml + '\n</div>\n</body>\n</html>\n';
  }

  window.SOPRender = { build, document: document_ };
})();

</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), msg = $('msg');

  const EXAMPLE = {
    docId: "SOP-KMC-007", version: "1.0", status: "review",
    customer: "Kingsmede Constructions Pty Ltd",
    processName: "RFI management",
    subtitle: "A step-by-step guide for raising, tracking and closing Requests for Information in Procore, authored for Kingsmede Constructions Pty Ltd.",
    processOwner: "S. Okafor · Project Manager",
    effectiveFrom: "01 Jun 2026",
    appliesTo: "All Kingsmede building projects (NSW & QLD), site and project-office teams.",
    approvals: {
      preparedBy: { name: "B. McGurk", date: "22 May 2026" },
      reviewedBy: { name: "S. Okafor", date: "28 May 2026" },
      approvedBy: { name: "", date: "" },
      scheduledReview: { name: "", date: "01 Dec 2026" }
    },
    purpose: "This procedure defines how Kingsmede raises and manages RFIs in Procore so that design queries are answered quickly, decisions are recorded against the project, and cost or programme impacts are captured early. It applies to all building projects from site mobilisation through to practical completion.",
    access: {
      tool: "RFIs",
      level: "Standard + RFI Manager rights",
      levelMeaning: "You can create RFIs and manage the full lifecycle of RFIs you create or are designated RFI Manager for — issuing, assigning, tracking, recording the official response and closing. Tool configuration and other users' RFIs sit with the RFIs Admin.",
      granular: [
        { name: "Act as RFI Manager", meaning: "Open, number and distribute RFIs you create or manage; set assignees and due dates; close RFIs." },
        { name: "Mark official responses", meaning: "Designate an answer as the Official Response on the RFI record." },
        { name: "View private RFIs (same company)", meaning: "See private RFIs associated with users in your company." },
        { name: "View project RFI insights", meaning: "Access response-time and overdue analytics for the project's RFIs." }
      ],
      notIncluded: [
        "Edit, reopen or delete other users' RFIs — handled by the RFIs Admin.",
        "Configure tool settings or the permissions table — handled by the RFIs Admin."
      ]
    },
    phases: [
      { name: "Raise", desc: "Site team drafts the RFI with drawings, photos and a clear question." },
      { name: "Assign", desc: "PM reviews, sets the reviewer and a due date within the SLA." },
      { name: "Respond", desc: "Consultant answers in Procore; commercial impact is assessed." },
      { name: "Close", desc: "Response is distributed, drawings updated, and the RFI closed." }
    ],
    procedureIntro: "Follow these steps in the Procore <strong>RFIs</strong> tool for every design or site query. Keep one question per RFI so responses stay clear and auditable.",
    referenceTool: "Procore · RFIs (web & mobile)",
    steps: [
      { title: "Create the RFI", role: "Site Engineer", system: "Procore · RFIs", time: "~5 min",
        body: "From the project, open <code>RFIs</code> and select <code>+ Create</code>. Write a single, specific question and reference the affected drawing.",
        bullets: ["Attach a marked-up drawing and site photos.", "Link the relevant Spec Section and Drawing number."] },
      { title: "Assign and set the due date", role: "Project Manager", system: "Procore · RFIs", time: "~3 min",
        body: "Review the draft, set the <strong>Assignee</strong> (responsible consultant) and a <strong>Due date</strong> within the contract SLA.",
        callout: { label: "Procore", body: "Default RFI SLA is 5 business days — set under <code>RFIs → Configure Settings</code>." } },
      { title: "Record the official response", role: "Design Consultant", system: "Procore · RFIs", time: "~10 min",
        body: "The assignee answers directly in Procore and attaches any revised documents. The response is time-stamped against the project record." },
      { title: "Assess impact and close", role: "Commercial Manager", system: "Procore · RFIs", time: "~5 min",
        body: "Check the response for cost or programme impact. Raise a variation if needed, distribute to the site team, then set the RFI to <code>Closed</code>.",
        bullets: ["Update the drawing register if documents changed."] }
    ],
    closeoutIntro: "Use this checklist before closing any RFI, and the issues table to resolve the most common problems the Kingsmede team encounters.",
    owner: "S. Okafor · Project Manager",
    checklist: [
      { text: "Official response recorded", hint: "RFI shows an Official Response with the consultant named.", owner: "PM" },
      { text: "Cost & programme impact assessed", hint: "Commercial Manager has confirmed impact or raised a variation.", owner: "CM" },
      { text: "Drawings & registers updated", hint: "Any superseded drawings replaced in the Drawings tool.", owner: "SE" },
      { text: "RFI distributed and closed", hint: "Status set to Closed; site team notified.", owner: "PM" }
    ],
    issues: [
      { code: "ERR-01", issue: "Assignee can't see the RFI", resolution: "Confirm the consultant is in the project Directory with RFI access; re-add as assignee." },
      { code: "ERR-02", issue: "RFI overdue with no response", resolution: "Use the RFIs overdue filter; PM escalates per the SLA and records a follow-up." },
      { code: "ERR-03", issue: "Multiple questions in one RFI", resolution: "Split into separate RFIs so each response is clear and auditable." }
    ],
    references: [
      { tool: "RFIs", url: "https://support.procore.com/products/online/user-guide/project-level/rfi" },
      { tool: "Drawings", url: "https://support.procore.com/products/online/user-guide/project-level/drawings" },
      { tool: "Directory", url: "https://support.procore.com/products/online/user-guide/project-level/directory" }
    ]
  };

  // Build the sandbox iframe document (SOP css + a viewer + an offscreen measuring page).
  function sandboxDoc() {
    return '<!doctype html><html lang="en-AU"><head><meta charset="utf-8">' +
      window.SOP_DESIGN.fontLinks +
      '<style>' + window.SOP_DESIGN.css + '</style>' +
      '<style>#sop-measure-wrap{position:absolute;left:-99999px;top:0;visibility:hidden;}' +
      'html,body{background:#E9E5DF;}</style></head><body>' +
      '<div class="viewer" id="viewer"></div>' +
      '<div id="sop-measure-wrap"><article class="page"><header class="pg-header"></header>' +
      '<div class="pg-body" id="sop-measure-body"></div><footer class="pg-footer"></footer></article></div>' +
      '</body></html>';
  }

  let ready = false;
  function initFrame(cb) {
    frame.onload = function () {
      const d = frame.contentDocument;
      if (d.fonts && d.fonts.ready) { d.fonts.ready.then(function () { ready = true; cb && cb(); }); }
      else { ready = true; cb && cb(); }
    };
    frame.srcdoc = sandboxDoc();
  }

  function getContent() {
    const raw = $('json').value.trim();
    return JSON.parse(raw);
  }

  function render() {
    let content;
    try { content = getContent(); }
    catch (e) { msg.textContent = 'JSON error: ' + e.message; msg.className = 'msg err'; return; }
    const doc = frame.contentDocument;
    if (!ready || !doc.getElementById('sop-measure-body')) { msg.textContent = 'Loading fonts…'; return; }
    try {
      const res = window.SOPRender.build(content, doc);
      doc.getElementById('viewer').innerHTML = res.pagesHtml;
      msg.textContent = 'Rendered · ' + res.total + ' page' + (res.total === 1 ? '' : 's') + '.';
      msg.className = 'msg';
    } catch (e) {
      msg.textContent = 'Render error: ' + e.message; msg.className = 'msg err';
    }
  }

  function download() {
    let content;
    try { content = getContent(); }
    catch (e) { msg.textContent = 'JSON error: ' + e.message; msg.className = 'msg err'; return; }
    const html = window.SOPRender.document(content, frame.contentDocument);
    const name = (content.docId || 'SOP') + '_' + (content.processName || 'Procore').replace(/[^a-z0-9]+/gi, '_');
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name + '.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    msg.textContent = 'Downloaded ' + a.download; msg.className = 'msg';
  }

  const PROMPT = 'You are filling content for a locked Procore SOP template. Read the attached transcript/notes and return ONLY a JSON object (no prose, no code fence) matching this shape. Leave any unknown value as an empty string so it shows as a placeholder — never invent names, dates, or IDs. Person fields are "Name · Role". Status is one of "in-progress" | "review" | "approved" | "draft" (a new SOP is never "approved").\n\n' + JSON.stringify(EXAMPLE, null, 2);

  $('loadExample').onclick = function () { $('json').value = JSON.stringify(EXAMPLE, null, 2); render(); };
  $('format').onclick = function () {
    try { $('json').value = JSON.stringify(JSON.parse($('json').value), null, 2); msg.textContent = 'Tidied.'; msg.className = 'msg'; }
    catch (e) { msg.textContent = 'JSON error: ' + e.message; msg.className = 'msg err'; }
  };
  $('render').onclick = render;
  $('download').onclick = download;
  $('copyPrompt').onclick = function () {
    navigator.clipboard.writeText(PROMPT).then(function () {
      const b = $('copyPrompt'); const t = b.textContent; b.textContent = 'Copied ✓';
      setTimeout(() => b.textContent = t, 1500);
    });
  };

  $('json').value = JSON.stringify(EXAMPLE, null, 2);
  initFrame(render);
})();
</script>
</body>
</html>
